<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bounce Animation</title>
    <style>
      .container {
        width: 80vw;
        height: 80vh;
        background: #000;
        position: relative;
      }
      .box {
        width: 121px;
        height: 121px;
        border-radius: 70px;
        position: absolute;
        bottom: 0;
        left: 0;
        background: rgb(168, 100, 100);
        /* animation: name duration timing-function delay iteration-count direction fill-mode; */
        animation: move-x 3s linear infinite, move-y 1s ease-out infinite alternate;
      }
      @keyframes move-y {
        from {
            bottom: 0;
        }
        to {
          bottom: 70%;
        }
      }
      @keyframes move-x {
        from {
            left: 0;
        }
        to {
            left: 80%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box"></div>
    </div>
  </body>
</html>
