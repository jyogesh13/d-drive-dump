<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Transform</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            border: 2px solid purple;
        }
        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100px;
            height: 100px;
            border: 2px solid black;
            background-color: red;
            /* transform: rotate(45deg); */
            /* transform: scale(1.5);  to increase the size of box*/

            /* apply multiple transform */
            /* skew stretches the element in a particular direction */ 
            transform: skew(30deg) rotate(45deg) scale(1.5);

            /* move the box to right and bottom by x% of their width */
            /* transform: translateX(45%) translateY(45%); */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            box
        </div>
    </div>
</body>
</html>
