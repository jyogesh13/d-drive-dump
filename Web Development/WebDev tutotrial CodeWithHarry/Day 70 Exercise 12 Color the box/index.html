<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript: Selecting by Ids, Classes and more</title>
    <style>
      body {
        background-color: rgb(26, 185, 111);
      }
      .outer-box {
        width: fit-content;
        padding: 10px;
        margin: auto;
        text-align: center;
      }
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }
      .box {
        width: 100px;
        height: 100px;
        border: 2px solid black;
      }
      .box:hover {
        background-color: rgb(155, 170, 237);
        cursor: pointer;
      }

      .box-btn{
        margin-top: 12px;
        display: flex;
        gap: 14px;
      }

      .btn{
        padding: 6px;
        width: 100px;
        cursor: pointer;
        border-radius: 10px;
        box-shadow: 5px 5px 7px rgba(10, 1, 1, 0.5);
        background-color: rgb(182, 151, 224);
        color: rgb(46, 9, 9);
      }
    </style>
  </head>
  <body>
    <div class="outer-box">
      <h1>Id selection, Class selection and more</h1>
      <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
      </div>
      <div class="box-btn">
        <button id="btn1" class="btn">Box 1</button>
        <button id="btn2" class="btn">Box 2</button>
        <button id="btn3" class="btn">Box 3</button>
        <button id="btn4" class="btn">Box 4</button>
        <button id="btn5" class="btn">Box 5</button>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
