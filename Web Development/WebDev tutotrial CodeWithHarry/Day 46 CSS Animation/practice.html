<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS animation Practice</title>
    <style>
        .container{
            background: #8b7b7b;
            width: 80vw;
            height: 80vh;
            padding: 10px;
        }
        .box{
            background: #000;
            padding: 20px;
            border-radius: 50%;
            margin: auto;
            width: 60px;
            height: 60px;
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation: bounce1 0.5s linear 2s infinite alternate-reverse  
        }
        @keyframes bounce1 {
            from{
                transform: translate(0,0);
            }
            to{
                transform: translateY(100px);
            }
        }
        @keyframes bounce2 {
            0%{
                transform: translate(0,0) rotate(-45deg);
            }
            50%{
                transform: translate(31vw, 50vh) rotate(0deg);
                background: #7f5858;
            }
            75%{
                transform: translate(31vw,45vh) rotate(0deg);
                background: #c3b9b9;
            }
            100%{
                transform: translate(31vw, 50vh) rotate(225deg);

            }
        }
        .table{
            background: #9f6363;
            margin: auto;
            width: 10vw;
            height: 8vh;
            transform: translateY(100px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
        </div>
        <div class="table"></div>
    </div>
</body>
</html>
